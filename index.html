<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="{{name}}" />
    <link rel="canonical" href="{{siteUrl}}/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="{{themeLight}}" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="{{themeDark}}" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme class before first paint so dark-mode visitors never see a light flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
        // A hash with a broken percent sequence (for example "#100%") makes the router's hash lookup throw, so drop it
        // before any module runs.
        try {
          decodeURIComponent(location.hash.slice(1));
        } catch (e) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{siteUrl}}/" />
    <meta property="og:image" content="{{siteUrl}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{name}}, {{role}}. {{headline}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{siteUrl}}/og.png" />
    <meta name="twitter:image:alt" content="{{name}}, {{role}}. {{headline}}" />

    <script type="application/ld+json">{{{jsonLd}}}</script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1.0625rem/1.6 system-ui, sans-serif">
        <h1>{{name}}</h1>
        <p>{{role}}, {{location}}</p>
        <p>{{summary}}</p>
        <ul>{{{noscriptLinks}}}</ul>
        <p>Turn on JavaScript to read the case studies and use search.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
